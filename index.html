  <style>

nt-size:.86rem}.stat .wins{margin:8px 0 2px;font-size:1.45rem;font-weight:950}.stat .spent{color:var(--lime);font-weight:800}.history-card{padding:21px}.history-actions{display:flex;gap:8px}.danger{padding:8px 11px;border:1px solid #62453f;border-radius:10px;color:#ffb0a5;background:#18231d}.table-wrap{overflow:auto}.history-table{width:100%;margin-top:10px;border-collapse:collapse;white-space:nowrap}.history-table th,.history-table td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:left}.history-table th{color:var(--muted);font-size:.8rem}.history-table td{font-size:.9rem}.history-table .amount{color:var(--lime);font-weight:850}.row-delete{border:0;color:#bba9a1;background:transparent}.empty{padding:50px 20px;color:var(--muted);text-align:center}.all-total{margin:5px 0 0;color:var(--muted)}.all-total strong{color:var(--lime)}dialog{width:min(430px,calc(100% - 30px));padding:0;border:1px solid var(--line);border-radius:22px;color:var(--ink);background:#202d26;box-shadow:0 28px 90px #0009}dialog::backdrop{background:#050a07b8;backdrop-filter:blur(3px)}.result{padding:28px;text-align:center}.cup{font-size:3.3rem}.result h3{margin:7px 0;font-size:1.7rem}.result p{color:var(--muted);line-height:1.7}.result strong{color:var(--lime)}.close{width:100%;margin-top:6px;padding:13px;border:0;border-radius:12px;color:#172016;background:var(--lime);font-weight:950}@media(max-width:900px){header{align-items:start;flex-direction:column}.play-grid{grid-template-columns:1fr}.wheel-card{min-height:auto}.stat-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:570px){.app{padding:17px 11px 38px}.tabs{width:100%}.tab{flex:1}.setup,.history-card,.wheel-card{padding:14px}.person{grid-template-columns:46px 1fr 35px}.person .drink,.person .price-wrap{grid-column:2/4}.person .delete{grid-column:3;grid-row:1}.wheel-wrap{width:100%}.spin{width:86px;height:86px;border-width:5px}.stat-grid{grid-template-columns:1fr 1fr}.history-card .section-head{align-items:start;flex-d   <style>
    .menu-trigger{width:100%;min-width:0;padding:9px;border:1px solid #405149;border-radius:9px;color:var(--ink);background:#111a15;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<body><div class="app"><header><div><p class="eyebrow">COFFEE ROULETTE</p><h1>오늘 커피는 누가 살까?</h1><p class="subtitle">비싼 음료를 고를수록 당첨 확률이 커집니다.</p></div><nav class="tabs" aria-label="화면 선택"><button class="tab active" data-view="play" type="button">룰렛</button><button class="tab" data-view="history" type="button">기록 · 통계</button></nav></header>
  <section class="view" id="playView"><div class="play-grid"><section class="card setup"><div class="section-head"><h2>오늘의 참여자</h2><button class="add" id="addBtn" type="button">+ 다른 사람</button></div><div id="rows"></div><p class="error" id="error" aria-live="polite"></p><div class="summary"><span>참여 <strong id="count">0명</strong></span><span>주문 합계 <strong id="total">0원</strong></span></div></section><section class="card wheel-card"><div><div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><canvas id="wheel" width="700" height="700"></canvas><button class="spin" id="spinBtn" type="button">돌리기</button></div><p class="hint">참여 버튼으로 오늘 빠진 사람을 제외할 수 있습니다.</p></div></section></div></section>
  <section class="view history-wrap" id="historyView" hidden><div class="stat-grid" id="stats"></div><section class="card history-card"><div class="section-head"><div><h2>당첨 히스토리</h2><p class="all-total">지금까지 결제한 금액 <strong id="grandTotal">0원</strong></p></div><button class="danger" id="clearHistory" type="button">전체 초기화</button></div><div class="table-wrap" id="historyTable"></div></section></section></div>
  <dialog id="menuDialog"><div class="menu-picker"><div class="menu-top"><h3>메뉴 선택</h3><button class="icon-close" id="menuClose" type="button" aria-label="메뉴 닫기">×</button></div><input class="menu-search" id="menuSearch" type="search" placeholder="아메리카노, 라떼 등 검색" aria-label="메뉴 검색"><div class="menu-list" id="menuList"></div><div class="menu-bottom"><p class="selected-menu" id="selectedMenu">메뉴를 선택해주세요.</p><div class="addons"><label class="addon"><input id="addShot" type="checkbox">샷 추가 +500원</label><label class="addon"><input id="addSyrup" type="checkbox">헤이즐넛/바닐라 시럽 +500원</label></div><button class="menu-confirm" id="menuConfirm" type="button" disabled>이 메뉴로 선택</button></div></div></dialog>
  <dialog id="resultDialog"><div class="result"><div class="cup">☕</div><h3 id="winnerTitle"></h3><p id="winnerText"></p><button class="close" id="closeBtn" type="button">기록 저장 완료</button></div></dialog>
  <script>
    const COLORS=['#E9855B','#E3B04B','#62A875','#5C8DC7','#A579C6','#D96C89','#57A7A1','#B9855D','#7986CB','#E07855'];
    const sizeOnly=(category,name,tall,grande,suffix='')=>[
      {category,label:`${name} · Tall${suffix}`,price:tall},
      {category,label:`${name} · Grande${suffix}`,price:grande}
    ];
    const hotIce=(category,name,tallHot,tallIce,grandeHot,grandeIce)=>[
      {category,label:`${name} · Tall Hot`,price:tallHot},{category,label:`${name} · Tall Ice`,price:tallIce},
      {category,label:`${name} · Grande Hot`,price:grandeHot},{category,label:`${name} · Grande Ice`,price:grandeIce}
    ];
    const MENU=[
      {category:'COFFEE',label:'에스프레소 · Single',price:2000},{category:'COFFEE',label:'에스프레소 · Double',price:2500},
      ...hotIce('COFFEE','아메리카노',2500,3000,3000,3500),
      ...hotIce('COFFEE','카페라떼',3000,3500,3500,4000),
      ...hotIce('COFFEE','바닐라라떼',3300,3800,3800,4300),
      ...hotIce('COFFEE','연유라떼',3300,3800,3800,4300),
      ...hotIce('COFFEE','카라멜마끼아또',3300,3800,3800,4300),
      ...hotIce('COFFEE','카페모카',3300,3800,3800,4300),
      ...sizeOnly('COFFEE','카푸치노',3000,3500,' Hot'),
      ...hotIce('DECAF','디카페인 아메리카노',3500,4000,4000,4500),
      ...hotIce('DECAF','디카페인 카페라떼',4000,4500,4500,5000),
      ...sizeOnly('LATTE','녹차라떼',3300,3800),
      ...sizeOnly('LATTE','초코라떼',3300,3800),
      ...sizeOnly('LATTE','홍차라떼',3500,4000),
      ...sizeOnly('LATTE','우유',2000,2500),
      ...sizeOnly('BLENDED','요거트스무디',3800,4300,' Ice'),
      ...sizeOnly('BLENDED','딸기요거트스무디',4300,4800,' Ice'),
      ...sizeOnly('BLENDED','블루베리요거트스무디',4300,4800,' Ice'),
      ...sizeOnly('BLENDED','청귤스무디',3800,4300,' Ice'),
      ...sizeOnly('BLENDED','망고스무디',4300,4800,' Ice'),
      ...sizeOnly('ADE','자몽에이드',3300,3800,' Ice'),
      ...sizeOnly('ADE','레몬에이드',3300,3800,' Ice'),
      ...sizeOnly('ADE','청귤에이드',3300,3800,' Ice'),
      ...sizeOnly('TEA','유자차',3000,3500),
      ...sizeOnly('TEA','자몽차',3000,3500),
      ...sizeOnly('TEA','청귤차',3000,3500),
      ...sizeOnly('TEA','매실차',3000,3500),
      ...sizeOnly('TEA','복숭아 아이스티',3000,3500,' Ice'),
      ...sizeOnly('TEA','캐모마일',2500,3000),
      ...sizeOnly('TEA','얼그레이',2500,3000),
      ...sizeOnly('TEA','페퍼민트',2500,3000),
      ...sizeOnly('TEA','루이보스',2500,3000),
      ...sizeOnly('TEA','윈터드림',2500,3000),
      {category:'BOTTLE',label:'생수',price:1300},{category:'BOTTLE',label:'골드메달 주스/스파클링',price:3300},
      {category:'BOTTLE',label:'분다버그 진저비어/망고',price:3800}
    ];
    const DEFAULTS=[{name:'김준원 부장',drink:'아메리카노 · Tall Ice',price:3000,fixed:true,active:true},{name:'두상우 상무',drink:'아메리카노 · Tall Ice',price:3000,fixed:true,active:true},{name:'나승일 사원',drink:'아메리카노 · Tall Ice',price:3000,fixed:true,active:true},{name:'배영훈 과장',drink:'아메리카노 · Tall Ice',price:3000,fixed:true,active:true},{name:'임정환 대리',drink:'아메리카노 · Tall Ice',price:3000,fixed:true,active:true}];
    const PEOPLE_KEY='coffeeRoulette.people.v2',HISTORY_KEY='coffeeRoulette.history.v2',rows=document.querySelector('#rows'),canvas=document.querySelector('#wheel'),ctx=canvas.getContext('2d'),spinBtn=document.querySelector('#spinBtn'),error=document.querySelector('#error');let rotation=0,spinning=false,people=load(PEOPLE_KEY,DEFAULTS),history=load(HISTORY_KEY,[]);
    function load(key,fallback){try{const saved=JSON.parse(localStorage.getItem(key));return Array.isArray(saved)?saved:structuredClone(fallback)}catch{return structuredClone(fallback)}}const money=n=>Math.round(n).toLocaleString('ko-KR')+'원';const escapeHtml=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function savePeople(){localStorage.setItem(PEOPLE_KEY,JSON.stringify(people))}function activePeople(){return people.filter(p=>p.active).map((p,i)=>({...p,color:COLORS[i%COLORS.length]}))}
    function renderRows(){rows.innerHTML='';people.forEach((p,index)=>{const el=document.createElement('div');el.className='person'+(p.active?'':' off');el.innerHTML=`<button class="toggle" type="button">${p.active?'참여':'제외'}</button><div><input class="name" aria-label="이름" maxlength="16" ${p.fixed?'disabled':''}><span class="fixed-mark">${p.fixed?'기본 멤버':'추가 멤버'}</span></div><button class="menu-trigger" type="button" aria-label="${escapeHtml(p.name)} 메뉴 선택">${escapeHtml(p.drink||'메뉴 선택')}</button><label class="price-wrap"><input class="price" aria-label="가격" type="number" min="500" max="100000" step="100"><span class="won">원</span></label>${p.fixed?'<span></span>':'<button class="delete" aria-label="참여자 삭제" type="button">×</button>'}`;el.querySelector('.name').value=p.name;el.querySelector('.price').value=p.price;el.querySelector('.toggle').addEventListener('click',()=>{people[index].active=!people[index].active;savePeople();renderRows()});el.querySelector('.name').addEventListener('input',e=>{people[index].name=e.target.value.trim();savePeople();update()});el.querySelector('.menu-trigger').addEventListener('click',()=>openMenu(index));el.querySelector('.price').addEventListener('input',e=>{people[index].price=Number(e.target.value);savePeople();update()});el.querySelector('.delete')?.addEventListener('click',()=>{people.splice(index,1);savePeople();renderRows()});rows.append(el)});update()}
    function update(){const active=activePeople(),total=active.reduce((s,p)=>s+(p.price>0?p.price:0),0);document.querySelector('#count').textContent=active.length+'명';document.querySelector('#total').textContent=money(total);error.textContent='';draw()}
    function draw(){const list=activePeople(),total=list.reduce((s,p)=>s+(p.price>0?p.price:0),0),c=canvas.width/2,radius=c-18;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();ctx.translate(c,c);ctx.rotate(rotation);let start=-Math.PI/2;if(!list.length){ctx.beginPath();ctx.arc(0,0,radius,0,Math.PI*2);ctx.fillStyle='#344139';ctx.fill();ctx.fillStyle='#a9b6ad';ctx.font='800 25px system-ui';ctx.textAlign='center';ctx.fillText('참여자를 선택해주세요',0,10)}list.forEach(p=>{const angle=total>0?(Math.max(0,p.price)/total)*Math.PI*2:Math.PI*2/list.length,end=start+angle;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,radius,start,end);ctx.closePath();ctx.fillStyle=p.color;ctx.fill();ctx.strokeStyle='#17211c';ctx.lineWidth=7;ctx.stroke();if(angle>.16){const mid=(start+end)/2;ctx.save();ctx.rotate(mid);ctx.translate(radius*.63,0);ctx.rotate(Math.PI/2);ctx.fillStyle='white';ctx.textAlign='center';ctx.shadowColor='#0008';ctx.shadowBlur=4;ctx.font='800 23px system-ui';ctx.fillText(p.name,0,-5);ctx.font='700 17px system-ui';ctx.fillText(money(p.price||0),0,21);ctx.restore()}start=end});ctx.beginPath();ctx.arc(0,0,radius,0,Math.PI*2);ctx.strokeStyle='#c7f36a';ctx.lineWidth=8;ctx.stroke();ctx.restore()}
    function validate(){const list=activePeople();if(list.length<2)return '참여자를 최소 2명 선택해주세요.';if(list.some(p=>!p.name))return '모든 참여자의 이름을 입력해주세요.';if(list.some(p=>!p.drink))return '모든 참여자의 음료명을 입력해주세요.';if(list.some(p=>!Number.isFinite(p.price)||p.price<500))return '음료 가격은 500원 이상으로 입력해주세요.';return ''}function normalize(a){return((a%(Math.PI*2))+Math.PI*2)%(Math.PI*2)}function winner(){const list=activePeople(),total=list.reduce((s,p)=>s+p.price,0),pointer=normalize(-Math.PI/2-rotation),relative=normalize(pointer+Math.PI/2);let sum=0;for(const p of list){sum+=(p.price/total)*Math.PI*2;if(relative<=sum+1e-9)return p}return list.at(-1)}
    function spin(){const message=validate();if(message){error.textContent=message;return}if(spinning)return;spinning=true;spinBtn.disabled=true;const start=rotation,random=new Uint32Array(1);crypto.getRandomValues(random);const r=random[0]/4294967296,target=start+(6+r*3)*Math.PI*2+r*Math.PI*2,duration=4300,begun=performance.now(),ease=t=>1-Math.pow(1-t,4);function frame(now){const t=Math.min(1,(now-begun)/duration);rotation=start+(target-start)*ease(t);draw();if(t<1)requestAnimationFrame(frame);else{rotation=normalize(rotation);draw();spinning=false;spinBtn.disabled=false;recordWinner(winner())}}requestAnimationFrame(frame)}
    function recordWinner(p){const list=activePeople(),total=list.reduce((s,x)=>s+x.price,0),chance=p.price/total*100,item={id:Date.now()+'-'+Math.random().toString(16).slice(2),at:new Date().toISOString(),name:p.name,drink:p.drink,personalPrice:p.price,total};history.unshift(item);localStorage.setItem(HISTORY_KEY,JSON.stringify(history));renderHistory();document.querySelector('#winnerTitle').textContent=p.name+' 당첨!';document.querySelector('#winnerText').innerHTML=`당첨자가 오늘 주문 합계 <strong>${money(total)}</strong>을 결제합니다.<br>${escapeHtml(p.drink)} 선택 · 당첨 확률 ${chance.toFixed(1)}%`;document.querySelector('#resultDialog').showModal()}
    function renderHistory(){const names=[...new Set([...DEFAULTS.map(p=>p.name),...history.map(h=>h.name)])];document.querySelector('#stats').innerHTML=names.map(name=>{const mine=history.filter(h=>h.name===name),spent=mine.reduce((s,h)=>s+h.total,0);return `<article class="stat"><div class="name">${escapeHtml(name)}</div><div class="wins">${mine.length}번 당첨</div><div class="spent">누적 ${money(spent)}</div></article>`}).join('');document.querySelector('#grandTotal').textContent=money(history.reduce((s,h)=>s+h.total,0));const area=document.querySelector('#historyTable');if(!history.length){area.innerHTML='<div class="empty">아직 당첨 기록이 없습니다.<br>첫 룰렛을 돌려보세요.</div>';return}area.innerHTML=`<table class="history-table"><thead><tr><th>일시</th><th>당첨자</th><th>선택 음료</th><th>결제 금액</th><th></th></tr></thead><tbody>${history.map(h=>`<tr><td>${new Date(h.at).toLocaleString('ko-KR',{dateStyle:'short',timeStyle:'short'})}</td><td>${escapeHtml(h.name)}</td><td>${escapeHtml(h.drink)}</td><td class="amount">${money(h.total)}</td><td><button class="row-delete" data-id="${h.id}" aria-label="기록 삭제">삭제</button></td></tr>`).join('')}</tbody></table>`;area.querySelectorAll('.row-delete').forEach(btn=>btn.addEventListener('click',()=>{history=history.filter(h=>h.id!==btn.dataset.id);localStorage.setItem(HISTORY_KEY,JSON.stringify(history));renderHistory()}))}
    let menuPersonIndex=-1,selectedOption=null;
    function openMenu(index){menuPersonIndex=index;selectedOption=MENU.find(item=>item.label===people[index].drink)||null;document.querySelector('#menuSearch').value='';document.querySelector('#addShot').checked=false;document.querySelector('#addSyrup').checked=false;renderMenuList();updateMenuSelection();document.querySelector('#menuDialog').showModal()}
    function renderMenuList(){const query=document.querySelector('#menuSearch').value.trim().toLowerCase(),filtered=MENU.filter(item=>item.label.toLowerCase().includes(query)||item.category.toLowerCase().includes(query)),groups=[...new Set(filtered.map(item=>item.category))],area=document.querySelector('#menuList');if(!filtered.length){area.innerHTML='<div class="no-menu">검색된 메뉴가 없습니다.</div>';return}area.innerHTML=groups.map(group=>`<section class="menu-group"><h4 class="menu-group-title">${group}</h4><div class="menu-options">${filtered.filter(item=>item.category===group).map(item=>`<button class="menu-option ${selectedOption===item?'selected':''}" type="button" data-menu-index="${MENU.indexOf(item)}"><span>${escapeHtml(item.label)}</span><small>${money(item.price)}</small></button>`).join('')}</div></section>`).join('');area.querySelectorAll('.menu-option').forEach(button=>button.addEventListener('click',()=>{selectedOption=MENU[Number(button.dataset.menuIndex)];renderMenuList();updateMenuSelection()}))}
    function updateMenuSelection(){const confirmButton=document.querySelector('#menuConfirm'),summary=document.querySelector('#selectedMenu');confirmButton.disabled=!selectedOption;if(!selectedOption){summary.textContent='메뉴를 선택해주세요.';return}const extra=(document.querySelector('#addShot').checked?500:0)+(document.querySelector('#addSyrup').checked?500:0);summary.innerHTML=`선택: <strong>${escapeHtml(selectedOption.label)} · ${money(selectedOption.price+extra)}</strong>`}
    function confirmMenu(){if(!selectedOption||menuPersonIndex<0)return;const shot=document.querySelector('#addShot').checked,syrup=document.querySelector('#addSyrup').checked,extras=[shot?'샷 추가':'',syrup?'시럽 추가':''].filter(Boolean),extraPrice=(shot?500:0)+(syrup?500:0);people[menuPersonIndex].drink=selectedOption.label+(extras.length?' + '+extras.join(' + '):'');people[menuPersonIndex].price=selectedOption.price+extraPrice;savePeople();renderRows();document.querySelector('#menuDialog').close()}
    document.querySelector('#menuSearch').addEventListener('input',renderMenuList);document.querySelector('#addShot').addEventListener('change',updateMenuSelection);document.querySelector('#addSyrup').addEventListener('change',updateMenuSelection);document.querySelector('#menuConfirm').addEventListener('click',confirmMenu);document.querySelector('#menuClose').addEventListener('click',()=>document.querySelector('#menuDialog').close());
    document.querySelector('#addBtn').addEventListener('click',()=>{if(people.length>=12){error.textContent='참여자는 최대 12명까지 등록할 수 있습니다.';return}people.push({name:'',drink:'아메리카노 · Tall Ice',price:3000,fixed:false,active:true});savePeople();renderRows()});document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===tab));document.querySelector('#playView').hidden=tab.dataset.view!=='play';document.querySelector('#historyView').hidden=tab.dataset.view!=='history';if(tab.dataset.view==='history')renderHistory()}));document.querySelector('#clearHistory').addEventListener('click',()=>{if(history.length&&confirm('모든 당첨 기록을 삭제할까요?')){history=[];localStorage.setItem(HISTORY_KEY,'[]');renderHistory()}});spinBtn.addEventListener('click',spin);document.querySelector('#closeBtn').addEventListener('click',()=>document.querySelector('#resultDialog').close());renderRows();renderHistory();
  </script>
</body></html>
